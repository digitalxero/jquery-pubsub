name: Repository policy
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  repository-policy:
    name: Repository policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Validate commits and repository policy
        run: python3 .repo-policy/check.py
